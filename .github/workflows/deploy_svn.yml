name: Deploy to SVN WordPress.org
on:
  push:
    branches:
      - main
jobs:
  check-version:
    name: Check readme.txt version
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare Stable tag with previous commit
        id: check
        run: |
          CURRENT=$(grep '^Stable tag:' readme.txt | awk '{print $NF}')
          HAS_PARENT=$(git rev-list --count HEAD^{commit} 2>/dev/null || echo 0)
          if [[ "$HAS_PARENT" -eq 0 ]]; then
            echo "Initial commit, deploying."
            DEPLOY="true"
          else
            PREVIOUS=$(git show "HEAD~1:readme.txt" 2>/dev/null | grep '^Stable tag:' | awk '{print $NF}' || true)
            if [[ -n "$CURRENT" && "$CURRENT" != "$PREVIOUS" ]]; then
              echo "Stable tag changed: '${PREVIOUS:-none}' -> '$CURRENT'"
              DEPLOY="true"
            else
              echo "Stable tag unchanged ('$CURRENT'), skipping deploy."
              DEPLOY="false"
            fi
          fi
          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to SVN
    needs: check-version
    if: needs.check-version.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: buy-one-click-woocommerce
